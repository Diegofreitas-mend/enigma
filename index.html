<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Enigma</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <h1>Enigma</h1>

      <p>mos o etucsE</p>

      <audio controls>
        <source src="audio.mp3" type="audio/mpeg" />
        Seu navegador não suporta áudio. <a href="audio.mp3">Baixe o áudio</a>.
      </audio>

      <form class="resposta" id="formulario">
        <label for="resposta">Sua resposta</label>
        <input id="resposta" name="resposta" type="text" placeholder="Digite a resposta" aria-describedby="mensagem" required />

        <button id="botao" type="submit">Confirmar</button>

        <p id="mensagem" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
